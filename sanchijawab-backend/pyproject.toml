[project]
name = "sanchijawab-backend"
version = "0.1.0"
description = "SanchiJawab API + background worker (FastAPI, Postgres/pgvector)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.19",

    # Database — PostgreSQL + pgvector (app data and vectors, one database)
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "alembic==1.14.0",

    # Queue / background jobs
    "celery==5.4.0",
    "redis==5.2.1",

    # Auth
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",

    # AI providers
    "openai==2.54.0",
    "google-genai==1.3.0",
    "cohere==5.13.3",
    "fastembed==0.4.2",

    # Crawling & parsing
    "crawl4ai==0.4.247",
    "playwright==1.49.1",
    "trafilatura==2.0.0",
    "beautifulsoup4==4.12.3",
    "docling==2.14.0",
    "openpyxl==3.1.5",

    # Storage
    "boto3==1.35.86",

    # Payments
    "razorpay==2.0.1",
    "stripe==16.0.0",

    # Config & validation
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.0",

    # Observability
    "sentry-sdk[fastapi]==2.19.2",
    "langfuse==4.16.0",

    # HTTP client
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# This codebase's existing style already runs long lines (function
# signatures with full type hints, inline comments); 220 covers the
# longest real line with a little margin rather than reflowing existing
# code just to satisfy a narrower limit picked after the fact.
line-length = 220
# Migrations are generated/historical records, not hand-maintained for
# style; poc/ is Phase 0 throwaway exploration scripts (see docker-compose.yml).
exclude = ["alembic/versions", "app/poc"]

[tool.ruff.lint]
# Pyflakes (real bugs: unused imports, undefined names) + pycodestyle
# errors — deliberately not the full "ALL"/opinionated plugin surface
# (datetime timezone-awareness, blind-except, etc.) for a first pass on an
# existing codebase; widen this later if the team wants stricter rules.
select = ["E", "F"]
ignore = [
    # Several files deliberately run code (Sentry init, Windows stdout
    # UTF-8 reconfigure) before their remaining imports — real ordering
    # requirements, not style mistakes.
    "E402",
]
